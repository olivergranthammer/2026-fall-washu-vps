<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 16 / 9;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Target the wizard link container to keep its exact position */
    .wizard-link {
      position: absolute;
      top: 14%;   
      left: 66.2%;  
      width: 25%; 
    }

    /* Make the wizard image fill the link container */
    .wizard-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    /* Changes the wizard image when hovered */
    .wizard-link:hover img {
      content: url("dreamwizard-diolaugue.png");
    }

     /* Target the cat link container to keep its exact position */
    .cat-link {
      position: absolute;
      top: 76%;   
      left: 12.2%;  
      width: 16%; 
    }

    /* Make the cat image fill the link container */
    .cat-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    /* Changes the cat image when hovered */
    .cat-link:hover img {
      content: url("blackcat-diolaugue.png");
    }

    /* Target the door link container so it keeps the exact same position */
    .door-link {
      position: absolute;
      top: 21.5%;   
      left: 34.5%;  
      width: 29%; 
    }

    /* Make the door image fill the link container */
    .door-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    /* Changes the door image to open when hovered */
    .door-link:hover img {
      content: url("entrancedoor-open.png");
      transform: translateY(4%);
    }
  </style>
</head>
<body>

  <audio autoplay loop>
    <source src="your-audio-file.mp3" type="audio/mpeg">
  </audio>

  <div class="scene">
    <img src="entrancebackground2.jpg" class="bg-image" alt="Background">
    
    <a href="maincorridor.html" class="door-link">
      <img src="entrancedoor-closed.png" alt="Door">
    </a>
    
    <a href="#" class="wizard-link">
      <img src="dreamwizard.png" alt="Wizard">
    </a>
     <a href="#" class="cat-link">
      <img src="blackcat.png" alt="Wizard">
    </a>
  </div>

</body>
</html>
