<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 16 / 9;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
    }
        /* Target the wizard link container to keep its exact position */
    .barrel-link {
      position: absolute;
      top:58.3%;   
      left: 57.2%;  
      width: 4.5%; 
    }

    /* Make the wizard image fill the link container */
    .barrel-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    /* Changes the wizard image when hovered */
    .barrel-link:hover img {
      content: url("barrel-open.png");
    }


  .fr-door-link {
      position: absolute;
      top: 44%;   
      left: 74.5%;  
      width: 4.5%; 
    }

    /* Make the door image fill the link container */

      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    
      .fl-door-link {

      width: 4.7%; 
    }

      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;

      width: 1.3%; 
    }

    /* Make the door image fill the link container */
    .ml-door-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    .b-door-link {
      position: absolute;
      top: 34.3%;

      width: 5.3%; 
    }

    /* Make the door image fill the link container */
    .b-door-link img {

    .forward-link img {

    .backward-link {
      position: absolute;

      z-index: 5;
    }

    .backward-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="scene">
    <img src="corridorbackground4.jpg" class="bg-image" alt="Background">

     <a href="hopper.html" class="fr-door-link">
      <img src="door.FR.png" alt="Door">
    </a>

     <a href="vangogh.html" class="fl-door-link">
