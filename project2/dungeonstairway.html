<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 16 / 9;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
    }

  .forward-link {
      position: absolute;
      top: 70%;   
      left: 50%;  
      width: 4.5%; 
    }

    /* Make the door image fill the link container */
    .forward-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    .backward-link {
      position: absolute;
      top: 85%;   
      left: 50%;  
      width: 4.5%; 
    }

    /* Make the door image fill the link container */
    .backward-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }


  </style>
</head>
<body>

  <div class="scene">
    <img src="dungeonstairwaybackground.jpg" class="bg-image" alt="Background">

     <a href="dungeonentrance.html" class="forward-link">
      <img src="forward.png" alt="arrow">
    </a>

    <a href="maincorridor.html" class="backward-link">
      <img src="backward.png" alt="arrow">
    </a>

  </div>

</body>
</html>
