<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 16 / 9;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
    }

  .forward-link {
      position: absolute;
      top: 70%;   
      left: 50%;  
      width: 4.5%; 
    }

    /* Make the door image fill the link container */
    .forward-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    .backward-link {
      position: absolute;
      top: 85%;   
      left: 50%;  
      width: 4.5%; 
    }

    /* Make the door image fill the link container */
    .backward-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    /* Target the wizard link container to keep its exact position */
    .knight-link {
      position: absolute;
      top: 10%;   
      left: 12.2%;  
      width: 20%; 
    }

    /* Make the wizard image fill the link container */
    .knight-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    /* Changes the wizard image when hovered */
    .knight-link:hover img {
      content: url("knightdiolaugue.png");
    }

  </style>
</head>
<body>

  <div class="scene">
    <img src="dungeonentrancebackground.jpg" class="bg-image" alt="Background">

     <a href="dungeonend.html" class="forward-link">
      <img src="forward.png" alt="arrow">
    </a>

    <a href="dungeonstairway.html" class="backward-link">
      <img src="backward.png" alt="arrow">
    </a>
  <a href="#" class="knight-link">
      <img src="knight.png" alt="Wizard">
    </a>
  </div>

</body>
</html>
