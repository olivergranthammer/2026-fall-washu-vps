<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 16 / 9;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hands-image {
      position: absolute;
      top: 35%;   
      left: 4.2%;  
      width: 90%; 
    }

    /* Target the link container so it keeps the exact same position */
    .sign-link {
      position: absolute;
      top: 35%;   
      left: 51%;  
      width: 6%; 
    }

    /* Make the image fill the lnk container */
    .sign-link img {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <audio autoplay loop>
    
    <source src="liquidsmooth.mp3" type="audio/mpeg">

  </audio>

  <div class="scene">

    <img src="menubackground.jpg" class="bg-image" alt="Background">

    <img src="hands.png" class="hands-image" alt="Background">

    <a href="entrance.html" class="sign-link">
      <img src="sign.png" alt="Sign">
    </a>

  </div>

</body>
</html>
